[project]
name = "workiq-backend"
version = "0.1.0"
description = "WorkIQ API – Microsoft 365 Copilot integration backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "msal>=1.32.0",
    "pydantic-settings>=2.7.0",
    "PyJWT[crypto]>=2.9.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.0.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.2.21",
    "anthropic>=0.84.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
